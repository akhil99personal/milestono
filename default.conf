############################################
# HTTP → HTTPS Redirect (PORT 80)  ✅ FIX
############################################
server {
    listen 80;
    listen [::]:80;

    server_name milestono.com www.milestono.com;

    return 301 https://$host$request_uri;
}

############################################
# HTTPS Configuration for Secure Traffic
############################################
server {
    listen 443 ssl;
    listen [::]:443 ssl;

    server_name milestono.com www.milestono.com;

    ########################################
    # SSL
    ########################################
    ssl_certificate /etc/letsencrypt/live/milestono.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/milestono.com/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    ########################################
    # Logs
    ########################################
    access_log /var/log/nginx/milestono.access.log;

    ########################################
    # React Frontend
    ########################################
    root /usr/share/nginx/html;
    index index.html index.htm;

    location / {
        try_files $uri $uri/ /index.html;
    }

    ########################################
    # Backend API (Docker service) ✅ FIX
    ########################################
    location /api/ {
        proxy_pass https://api.milestono.com:6005;

        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_connect_timeout 60s;
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
    }

    ########################################
    # Error Pages
    ########################################
    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
    }

    ########################################
    # Block hidden files
    ########################################
    location ~ /\.(?!well-known).* {
        deny all;
    }
}
